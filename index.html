<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>गंग्यापार, कुरंगा – हमारा गाँव</title><link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#fdf6e3;--ink:#1d2a24;--mut:#5a6558;--g:#1a5b22;--gb:#1a5b22;--s:#f59e0b;--b:#1c2b6d;--card:#fffdf6;--ln:#ecdfb8;--sky:#cfe8f7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--ink:#ebf1e6;--mut:#a3b5a6;--g:#86d391;--gb:#2b7a37;--s:#f7b733;--b:#9db1ff;--card:#17251b;--ln:#2c3e30;--sky:#16293d;color-scheme:dark}}
*{box-sizing:border-box}:root[data-theme="dark"]{--bg:#0f1a12;--ink:#ebf1e6;--mut:#a3b5a6;--g:#86d391;--gb:#2b7a37;--s:#f7b733;--b:#9db1ff;--card:#17251b;--ln:#2c3e30;--sky:#16293d;color-scheme:dark}
.nb{margin-left:6px;font:inherit;font-size:15px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:18px;padding:3px 12px;cursor:pointer;white-space:nowrap}.nb:first-of-type{margin-left:auto}.nb:focus-visible{outline:3px solid var(--s)}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 'Hind',sans-serif}
h1,h2,h3{font-family:'Tiro Devanagari Hindi',serif;font-weight:400;margin:0;line-height:1.3}
nav{position:sticky;top:0;z-index:9;background:#14471b;align-items:center;display:flex;gap:4px;padding:8px 10px;overflow-x:auto}
nav a{color:#fff;text-decoration:none;padding:6px 13px;border-radius:18px;white-space:nowrap;font-size:16px}
nav a:hover,nav a:focus-visible{background:var(--s);outline:none}
.hero{background:linear-gradient(var(--sky),var(--bg));color:var(--ink);text-align:center;padding:22px 18px 38px;border-bottom:8px solid var(--s)}.logo{width:min(560px,92vw);height:auto;display:block;margin:0 auto}.nl{height:36px;width:auto;margin-right:6px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero p{margin:10px auto 0;max-width:640px}
.pin{display:inline-block;margin-top:12px;border:1.5px solid var(--s);border-radius:8px;padding:2px 14px}
section{max-width:1040px;margin:0 auto;padding:46px 18px 6px}
h2{font-size:clamp(26px,5vw,36px);color:var(--g);margin-bottom:4px}.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.card h3{font-size:21px;margin:4px 0}.card p{margin:4px 0;white-space:pre-line}.card small{color:var(--mut)}
.card img{width:100%;border-radius:10px;margin-bottom:6px}
.tag{display:inline-block;font-size:14px;font-weight:600;padding:0 10px;border-radius:12px;background:var(--s);color:#1c2a20}
.tag.live{background:#d62828;color:#fff}.tag.done{background:var(--mut);color:#fff}.tag.up{background:var(--b);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button{font:inherit}
input,select,textarea{padding:9px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:150px}
.btn,.chip{border:1.5px solid var(--gb);background:var(--gb);color:#fff;border-radius:20px;padding:4px 16px;cursor:pointer;text-decoration:none;font-size:15px;display:inline-block}
.chip{background:transparent;color:var(--g)}.chip[aria-pressed=true]{background:var(--gb);color:#fff}.btn.red{background:#c62828;border-color:#c62828}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--s);outline-offset:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.facts div{border-left:4px solid var(--s);padding:2px 12px;background:var(--card)}.facts b{display:block;font-size:14px;color:var(--mut);font-weight:500}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;position:relative}.tile{display:block;width:100%;aspect-ratio:4/3;border:0;border-radius:12px;background:var(--c) center/cover;cursor:pointer}
.gal figcaption{font-size:14px;color:var(--mut)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}
.prog{height:10px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--g)}
#cd{font-family:'Tiro Devanagari Hindi',serif;font-size:26px;color:var(--s)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;color:#fff;padding:16px;gap:10px}
#lb.on{display:flex}#lb img{max-width:94vw;max-height:76vh;border-radius:10px}
#adm{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#1c2a20;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
#adm .btn{background:var(--s);border-color:var(--s);color:#1c2a20}
.ed{border:2px dashed var(--s);padding:8px;border-radius:12px;margin-top:8px}
dialog{width:min(560px,94vw);border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink)}
dialog label{display:block;margin:10px 0 2px;font-size:15px;color:var(--mut)}
footer{margin:50px 0 70px;background:#14471b;color:#e4f0e8;text-align:center;padding:24px 16px}footer a{color:#ffd08a}
.empty{color:var(--mut)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
